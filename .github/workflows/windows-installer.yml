name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.2.3)'
        required: false
        default: '0.2.0'

jobs:
  build-windows:
    name: Build and package for Windows
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      # -- 1. Source code ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -- 2. Qt6 + WebEngine (MSVC build from Qt's official mirrors) --------
      # Qt WebEngine requires MSVC on Windows (Chromium is MSVC-only).
      # aqtinstall provides pre-built binaries matching the official Qt installer.
      - name: Install Qt6 with WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'

      # -- 3. MSVC x64 developer environment --------------------------------
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # -- 4. Generate application icon (SVG → ICO) -----------------------
      # ImageMagick (magick) is pre-installed on GitHub Actions Windows runners.
      # The ICO is written to src/ (for CMake RC embedding) and installer/
      # (for the NSIS MUI_ICON define).
      - name: Generate application icon
        shell: pwsh
        run: |
          $sizes = @(256, 128, 64, 48, 32, 16)
          $pngs  = @()
          foreach ($s in $sizes) {
            $p = "$env:TEMP\icon_$s.png"
            magick -background none r-gui-2-logo.svg -resize "${s}x${s}" $p
            $pngs += $p
          }
          & magick $pngs src\r-gui-2.ico
          Copy-Item src\r-gui-2.ico installer\r-gui-2.ico

      # -- 5. Derive version string ------------------------------------------
      - name: Compute version
        id: version
        shell: bash
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      # -- 6. Configure & build ----------------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      # -- 7. Stage application files ----------------------------------------
      - name: Deploy Qt DLLs (windeployqt6)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging | Out-Null
          Copy-Item build\bin\rgui2.exe installer\staging\

          # Collect all Qt6 and plugin DLLs next to the executable.
          windeployqt6 --release --compiler-runtime --dir installer\staging installer\staging\rgui2.exe

      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
            -OutFile installer\staging\vc_redist.x64.exe

      - name: Copy runtime data (themes, fonts, R package)
        shell: pwsh
        run: |
          Copy-Item -Recurse gogh-themes  installer\staging\gogh-themes
          Copy-Item -Recurse fonts        installer\staging\fonts
          Copy-Item -Recurse rgui2pkg     installer\staging\rgui2pkg

      - name: Download rgui2 R package tarball
        shell: pwsh
        run: |
          $ver   = "${{ inputs.version }}"
          $parts = $ver -split '\.'
          $tag   = "v$($parts[0]).$($parts[1])"
          $url   = "https://github.com/pachadotdev/r-gui-2/releases/download/${tag}/rgui2_${ver}.tar.gz"
          Write-Host "Downloading rgui2 package from ${url}"
          Invoke-WebRequest -Uri $url -OutFile installer\staging\rgui2pkg.tar.gz

      - name: Pre-install R packages for bundling
        shell: pwsh
        run: |
          # Use whatever R is already installed on the runner image (no fixed version).
          $rHome = & Rscript -e "cat(R.home())"
          Write-Host "Using R installation at: $rHome"

          # Install jsonlite as a pre-built Windows binary (no compilation needed)
          Write-Host "Installing jsonlite..."
          & Rscript -e "install.packages('jsonlite', repos='https://cloud.r-project.org', type='win.binary')"
          if ($LASTEXITCODE -ne 0) { Write-Error "jsonlite install failed"; exit 1 }

          # Install rgui2 from source (pure R package — no compiler required)
          Write-Host "Installing rgui2..."
          $tarball = (Join-Path $PWD "installer\staging\rgui2pkg.tar.gz") -replace '\\', '/'
          & Rscript -e "install.packages('$tarball', repos=NULL, type='source')"
          if ($LASTEXITCODE -ne 0) { Write-Error "rgui2 install failed"; exit 1 }

          # Stage the installed package trees for NSIS to bundle
          New-Item -ItemType Directory -Force installer\staging\R-library | Out-Null
          foreach ($pkg in @("jsonlite", "rgui2")) {
            $src = Join-Path $rHome "library\$pkg"
            if (Test-Path $src) {
              Copy-Item -Recurse $src installer\staging\R-library\
              Write-Host "Staged: $pkg"
            } else {
              Write-Error "Package not found after install: $pkg"; exit 1
            }
          }

      # -- 8. NSIS installer -------------------------------------------------
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: cmd
        run: >
          makensis
          /DAPP_VERSION=${{ steps.version.outputs.version }}
          installer\windows-installer.nsi

      # -- 9. Publish artifacts ----------------------------------------------
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: R-GUI-2-${{ steps.version.outputs.version }}-Windows
          path: installer\R-GUI-2-*-Setup.exe
          if-no-files-found: error

      - name: Upload installer to GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ inputs.version }}"
          tag="v${ver%.*}"   # 0.2.0 -> v0.2
          gh release upload "${tag}" installer/R-GUI-2-*-Setup.exe --clobber
