name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.2.3)'
        required: false
        default: '0.0.0-dev'

jobs:
  build-mac:
    name: Build and package for macOS
    runs-on: macos-13

    steps:
      # -- 1. Source code ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -- 2. Qt6 build environment ------------------------------------------
      # Only Qt Base (Core/Gui/Widgets/Network) is needed; no WebEngine.
      - name: Set up Qt6 on macOS
        run: |
          brew install qt6
          echo "$(brew --prefix qt6)/bin" >> $GITHUB_PATH

      # -- 3. Configure & build ----------------------------------------------
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt6)"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      # -- 4. Create .app bundle ---------------------------------------------
      # The binary resolves gogh-themes and fonts as ./gogh-themes and ./fonts
      # relative to itself, so both directories must live inside Contents/MacOS.
      - name: Create .app bundle
        run: |
          mkdir -p Simpler/Contents/MacOS
          mkdir -p Simpler/Contents/Resources

          cp build/bin/simpler Simpler/Contents/MacOS/
          cp -r build/bin/gogh-themes Simpler/Contents/MacOS/gogh-themes
          cp -r build/bin/fonts       Simpler/Contents/MacOS/fonts
          cp README.md                Simpler/Contents/Resources/

          cat > Simpler/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>simpler</string>
            <key>CFBundleIdentifier</key>
            <string>com.pacha.simpler</string>
            <key>CFBundleName</key>
            <string>Simpler</string>
            <key>CFBundleVersion</key>
            <string>${{ inputs.version }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          EOF

      # -- 5. Bundle Qt frameworks -------------------------------------------
      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          "$(brew --prefix qt6)/bin/macdeployqt" Simpler

      # -- 6. Create DMG -----------------------------------------------------
      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R Simpler dmg-root/
          hdiutil create \
            -volname "Simpler" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            simpler-${{ inputs.version }}-mac.dmg

      # -- 7. Upload artifact ------------------------------------------------
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Simpler-${{ inputs.version }}-macOS
          path: simpler-*-mac.dmg
          if-no-files-found: error
